<!doctype html><meta charset="utf-8"><style>
body{margin:0;background:#fff;font:12px monospace}
iframe{width:1440px;height:1400px;border:0;position:absolute;left:0;top:0;visibility:hidden}
pre{position:relative;z-index:5;white-space:pre-wrap;padding:10px}
</style><iframe id="f" src="./index.html"></iframe><pre id="o">…</pre>
<script>
f.addEventListener('load',function(){setTimeout(function(){
 var w=f.contentWindow,d=f.contentDocument,o=[];
 o.push('innerW:'+w.innerWidth+' scrollW:'+d.documentElement.scrollWidth);
 ['.rail','.rail-list','.rail-list li','.rail-list .rn','.rail-cta','.topbar','.hero-copy','h1','.hero-art','.portrait'].forEach(function(s){
  var e=d.querySelector(s); if(!e){o.push(s+' NULL');return;}
  var b=e.getBoundingClientRect(),cs=w.getComputedStyle(e);
  o.push(s+' x:'+Math.round(b.x)+' y:'+Math.round(b.y)+' w:'+Math.round(b.width)+' h:'+Math.round(b.height)+' disp:'+cs.display+' vis:'+cs.visibility+' op:'+cs.opacity+' col:'+cs.color);
 });
 var h1=d.querySelector('h1');
 o.push('h1 fontSize:'+w.getComputedStyle(h1).fontSize);
 d.querySelectorAll('h1 .l').forEach(function(e,i){
   var r=e.getBoundingClientRect();
   var rects=e.getClientRects().length;
   o.push('  line'+i+' w:'+Math.round(r.width)+' h:'+Math.round(r.height)+' clientRects:'+rects+' text:'+e.textContent);
 });
 var over=[];d.querySelectorAll('*').forEach(function(e){var b=e.getBoundingClientRect();if(b.right>w.innerWidth+1&&b.width>0){var c=e.className;if(c&&c.baseVal!==undefined)c=c.baseVal;over.push(e.tagName+'.'+c+' r:'+Math.round(b.right));}});
 o.push('OVERFLOW('+over.length+'): '+over.slice(0,10).join(' | '));
 document.getElementById('o').textContent=o.join('\n');
},1600);});
</script>
